[package]
name = "slopio-buf-ring"
description = "io_uring provided buffer ring memory for the slopio runtime"
keywords = ["io-uring", "buffer", "ring"]
categories = ["os::linux-apis", "memory-management"]
readme = "../README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Trade away mapping hints the kernel is free to ignore, so a ring can be built
# somewhere there is no kernel. Enabled by `slopio-core/simulation`.
simulation = []

[dependencies]
io-uring = "0.7.15"
rustix = { version = "1.1.3", features = ["mm"] }

[dev-dependencies]
rand = "0.9.2"
