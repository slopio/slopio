[package]
name = "runtime-core"
version = "0.1.0"
edition = "2024"

[features]
tracing = []
local_debug_collector = ["tracing"]

# Compile-time max verbosity. Pick at most one in each group.
up_to_off = []
up_to_error = []
up_to_warn = []
up_to_info = []
up_to_debug = []
up_to_trace = []

# Release-only variants — only effective under cfg(not(debug_assertions)).
up_to_off_in_release = []
up_to_error_in_release = []
up_to_warn_in_release = []
up_to_info_in_release = []
up_to_debug_in_release = []
up_to_trace_in_release = []

[dependencies]
io-uring = "0.7.11"
libc = "0.2.178"
io_uring_rb = { path = "../io_uring_rb" }
runtime_ebpf_balancer = { path = "../runtime_ebpf_balancer" }
async_timers = { path = "../async_timers" }
runtime-streams = { path = "../runtime-streams" }
mimalloc = { version = "0.1.48", features = ["local_dynamic_tls", "v3"] }
pin-project = "1.1.10"
slab = "0.4.11"
socket2 = { version = "0.6.1", features = ["all"] }
bumpalo = { version = "3.20.2", features = ["collections"] }
rand = "0.8"
smallvec = { version = "1", features = ["union"] }
bitfield-struct = "0.13.0"

[dev-dependencies]
libc = "0.2.178"
