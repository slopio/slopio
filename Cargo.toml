[package]
name = "runtime"
version = "0.1.0"
edition = "2024"

[features]
tls = ["rustls"]
test-monitor = []

[[example]]
name = "tls"
required-features = ["tls"]

[dependencies]
io-uring = "0.7.11"
libc = "0.2.178"
io_uring_rb = { git = "https://github.com/saucisoupe/io_uring_rb" }
runtime_ebpf_balancer = { git = "https://github.com/saucisoupe/runtime_ebpf_balancer" }
async_timers =  { git = "https://github.com/saucisoupe/async_timers" }
runtime-streams =  { git = "https://github.com/saucisoupe/runtime-streams" }
rustls = { version = "0.23.36", optional = true }
rustls-pemfile = "2"

mimalloc = { version = "0.1.48", features = ["local_dynamic_tls", "v3"] }
pin-project = "1.1.10"
slab = "0.4.11"
socket2 = { version = "0.6.1", features = ["all"] }
tquic = { version = "1.6.0", features = ["h3"] }
bytes = "1"
opentelemetry_sdk = "0.31.0"
opentelemetry = "0.31.0"
opentelemetry-stdout = "0.31.0"
opentelemetry-proto = { version = "0.31", features = ["gen-tonic-messages", "trace"] }
prost = "0.14"
bumpalo = { version = "3.20.2", features = ["collections"] }
httparse = "1"
memchr = "2.8.0"

[dependencies.rand]
version = "0.8"

[dev-dependencies]

[build]
features = ["tls"]
