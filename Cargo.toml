[package]
name = "runtime"
version = "0.1.0"
edition = "2024"

[features]
tls      = ["dep:rustls", "dep:rustls-pemfile"]
test-monitor = []
tracing  = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-stdout", "dep:prost"]
http     = []
http1    = ["http", "dep:httparse", "dep:memchr"]
quic     = ["http", "dep:tquic", "dep:bytes"]

[[example]]
name = "tls"
required-features = ["tls"]

[[example]]
name = "http"
required-features = ["http1"]

[[example]]
name = "http3"
required-features = ["quic"]

[dependencies]
io-uring = "0.7.11"
libc = "0.2.178"
io_uring_rb = { git = "https://github.com/saucisoupe/io_uring_rb" }
runtime_ebpf_balancer = { git = "https://github.com/saucisoupe/runtime_ebpf_balancer" }
async_timers =  { git = "https://github.com/saucisoupe/async_timers" }
runtime-streams =  { git = "https://github.com/saucisoupe/runtime-streams" }
rustls = { version = "0.23.36", optional = true }
rustls-pemfile = { version = "2", optional = true }

mimalloc = { version = "0.1.48", features = ["local_dynamic_tls", "v3"] }
pin-project = "1.1.10"
slab = "0.4.11"
socket2 = { version = "0.6.1", features = ["all"] }
tquic = { version = "1.6.0", features = ["h3"], optional = true }
bytes = { version = "1", optional = true }
opentelemetry_sdk = { version = "0.31.0", optional = true }
opentelemetry = { version = "0.31.0", optional = true }
opentelemetry-stdout = { version = "0.31.0", optional = true }
prost = { version = "0.14", optional = true }
bumpalo = { version = "3.20.2", features = ["collections"] }
httparse = { version = "1", optional = true }
memchr = { version = "2.8.0", optional = true }

[dependencies.rand]
version = "0.8"

[dev-dependencies]

[build]
features = ["tls"]
