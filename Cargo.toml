[package]
name = "runtime"
version = "0.1.0"
edition = "2024"

[features]
default = ["quic"]
tls = ["rustls"]
quic = ["dep:quiche", "dep:ring"]

[[example]]
name = "tls"
required-features = ["tls"]

[[example]]
name = "quic"
required-features = ["quic"]

[dependencies]
io-uring = "0.7.11"
libc = "0.2.178"
io_uring_rb = { git = "https://github.com/saucisoupe/io_uring_rb" }
async_timers =  { git = "https://github.com/saucisoupe/async_timers" }
runtime-streams =  { git = "https://github.com/saucisoupe/runtime-streams" }
rustls = { version = "0.23.36", optional = true }
quiche = { version = "0.23", optional = true }
ring = { version = "0.17", optional = true }
rustls-pemfile = "2"

mimalloc = { version = "0.1.48", features = ["local_dynamic_tls", "v3"] }
pin-project = "1.1.10"
slab = "0.4.11"
socket2 = { version = "0.6.1", features = ["all"] }

[dev-dependencies]
rand = "0.8"

[build]
features = ["tls"]
