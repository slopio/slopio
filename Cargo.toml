[workspace]
members = [
    "slopio-timers",
    "slopio-buf-ring",
    "slopio-ebpf-balancer",
    "slopio-core",
    "slopio-machine",
    "slopio-streams",
    "slopio",
    "slopio-http",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/slopio/slopio"

[workspace.dependencies]
slopio-core = { path = "slopio-core", version = "0.1.0" }
slopio-machine = { path = "slopio-machine", version = "0.1.0" }
slopio-streams = { path = "slopio-streams", version = "0.1.0" }
slopio-timers = { path = "slopio-timers", version = "0.1.0" }
slopio-buf-ring = { path = "slopio-buf-ring", version = "0.1.0" }
slopio-ebpf-balancer = { path = "slopio-ebpf-balancer", version = "0.1.0" }

[profile.release]
debug = true
# Panics in spawned tasks unwind through the runtime's internal data
# structures (slab, waker queue) leaving them in an inconsistent state.
# With `abort`, the process exits immediately instead — no corruption.
# This is what production servers want anyway; debugging-build users get
# the same guarantee via [profile.dev].
panic = "abort"

[profile.dev]
panic = "abort"

[profile.bench]
debug = true
# `panic` is ignored for bench profile by cargo, no point setting it here.
