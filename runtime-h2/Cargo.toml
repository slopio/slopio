[package]
name = "runtime-h2"
version = "0.1.0"
edition = "2024"

[dependencies]
runtime-core = { path = "../runtime-core" }
io-uring = "0.7.11"
bytes = "1"
http = "1"
fnv = "1"
futures-sink = "0.3"
futures-core = "0.3"
tokio = { version = "1", features = ["io-util"] }
atomic-waker = "1"
slab = "0.4"
indexmap = "2"

[dev-dependencies]
serde_json = "1"
hex = "0.4"
quickcheck = "1"
quickcheck_macros = "1"
rand = "0.8"
env_logger = "0.11"
