[package]
name = "runtime"
version = "0.1.0"
edition = "2024"

[features]
# Forwarded so a test crate can build the simulated ring.
simulation = ["runtime-core/simulation"]
tracing               = ["runtime-core/tracing"]
otlp                  = ["tracing", "dep:runtime-h2"]
local_debug_collector = ["runtime-core/local_debug_collector"]
ebpf_balancer         = ["runtime-core/ebpf_balancer"]

[dependencies]
runtime-core = { path = "../runtime-core" }
runtime-h2 = { package = "popple-h2", git = "ssh://git@github.com/saucisoupe/popple-h2", optional = true }
libc = "0.2.178"
mimalloc = { version = "0.1.48", features = ["local_dynamic_tls", "v3"] }

[dev-dependencies]
runtime-streams = { path = "../runtime-streams" }
bytes = "1"
http = "1"
rand = "0.8"
socket2 = "0.5"
