[package]
name = "slopio-ebpf-balancer"
description = "An eBPF SO_REUSEPORT program that keeps each QUIC connection on the core that owns it, for slopio"
keywords = ["ebpf", "quic", "reuseport", "io-uring"]
categories = ["network-programming", "os::linux-apis"]
readme = "../README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
libc = "0.2.182"
object = { version = "0.36", default-features = false, features = ["elf", "read"] }
