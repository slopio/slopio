[package]
name = "io_uring_rb"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
# Trade away mapping hints the kernel is free to ignore, so a ring can be built
# somewhere there is no kernel. Enabled by `runtime-core/simulation`.
simulation = []

[dependencies]
io-uring = "0.7.15"
rustix = { version = "1.1.3", features = ["mm"] }

[dev-dependencies]
rand = "0.9.2"
