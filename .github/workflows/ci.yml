name: CI

on:
  push:
  workflow_dispatch:
    inputs:
      miri:
        description: Also run every simulated suite under Miri (long)
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # runtime_ebpf_balancer's build.rs compiles the BPF object unconditionally
      - name: Install eBPF build deps
        run: sudo apt-get update && sudo apt-get install -y clang libbpf-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@just
      - uses: Swatinem/rust-cache@v2
      # Zero-copy sends and registered buffers pin pages against RLIMIT_MEMLOCK
      - name: Test
        run: |
          sudo prlimit --pid $$ --memlock=unlimited:unlimited
          cargo test --workspace --no-fail-fast
      - name: Test simulated suites
        run: just test-sim --no-fail-fast

  # Minutes of interpretation per suite: only when asked for, from the Actions tab.
  miri:
    if: github.event_name == 'workflow_dispatch' && inputs.miri
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: taiki-e/install-action@just
      - uses: Swatinem/rust-cache@v2
      - name: Miri
        run: just miri --no-fail-fast
